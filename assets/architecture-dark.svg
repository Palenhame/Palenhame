<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="100%" height="100%">
  <defs>
    <style>
      .font { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .box-bg { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 8px; }
      .box-docker { fill: #0d1117; stroke: #1f6feb; stroke-dasharray: 4 4; stroke-width: 1.5; rx: 10px; }
      .t-title { font-size: 13px; font-weight: bold; fill: #ffffff; }
      .t-sub { font-size: 10px; fill: #8b949e; }
      .t-accent { font-size: 10px; fill: #58a6ff; font-weight: bold; }
      .arrow { stroke: #58a6ff; stroke-width: 1.8; fill: none; marker-end: url(#arrow-head); }
      .arrow-purple { stroke: #bc8cff; stroke-width: 1.8; fill: none; marker-end: url(#arrow-purple); }
      .arrow-green { stroke: #3fb950; stroke-width: 1.8; fill: none; marker-end: url(#arrow-green); }
    </style>
    <marker id="arrow-head" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#bc8cff" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#3fb950" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="850" height="180" fill="#0d1117" rx="10" stroke="#30363d" stroke-width="1" />

  <!-- Node 1: Ingress / Client -->
  <g transform="translate(20, 55)">
    <rect width="130" height="70" class="box-bg" />
    <text x="65" y="32" class="font t-title" text-anchor="middle">Traffic</text>
    <text x="65" y="48" class="font t-sub" text-anchor="middle">HTTPS / gRPC</text>
    <text x="65" y="60" class="font t-accent" text-anchor="middle">High QPS</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 150 90 L 195 90" class="arrow" />

  <!-- Node 2: Gateway / Nginx -->
  <g transform="translate(200, 55)">
    <rect width="135" height="70" class="box-bg" />
    <text x="67" y="32" class="font t-title" text-anchor="middle">Gateway</text>
    <text x="67" y="48" class="font t-sub" text-anchor="middle">Nginx / SSL</text>
    <text x="67" y="60" class="font t-accent" text-anchor="middle">Rate Limiting</text>
  </g>

  <!-- Arrow 2 -> Docker Box -->
  <path d="M 335 90 L 375 90" class="arrow" />

  <!-- Docker Container Enclosure -->
  <rect x="380" y="20" width="220" height="140" class="box-docker" />
  <text x="392" y="37" class="font" fill="#1f6feb" font-size="11" font-weight="bold">🐳 Docker / Linux cgroups</text>

  <!-- Node 3: Go Runtime & Python Async -->
  <g transform="translate(395, 50)">
    <rect width="190" height="95" class="box-bg" stroke="#58a6ff" />
    <text x="95" y="28" class="font t-title" text-anchor="middle">Backend Core</text>
    <text x="95" y="48" class="font t-accent" text-anchor="middle">Go Runtime (Goroutines)</text>
    <text x="95" y="66" class="font" fill="#bc8cff" font-size="10" text-anchor="middle">Python (FastAPI / Workers)</text>
    <text x="95" y="82" class="font t-sub" text-anchor="middle">ErrGroup / Asyncio</text>
  </g>

  <!-- Branching Arrows from Core to Storage -->
  <!-- Upper Arrow -> Redis -->
  <path d="M 585 80 L 645 52" class="arrow-purple" />
  <!-- Lower Arrow -> Postgres -->
  <path d="M 585 115 L 645 130" class="arrow-green" />

  <!-- Node 4: Redis Cache -->
  <g transform="translate(650, 22)">
    <rect width="175" height="60" class="box-bg" stroke="#bc8cff" />
    <text x="87" y="26" class="font t-title" text-anchor="middle">Redis Cache</text>
    <text x="87" y="42" class="font" fill="#bc8cff" font-size="10" text-anchor="middle">Read-Through / Streams</text>
    <text x="87" y="54" class="font t-sub" text-anchor="middle">&lt; 1ms Latency</text>
  </g>

  <!-- Node 5: PostgreSQL Storage -->
  <g transform="translate(650, 98)">
    <rect width="175" height="60" class="box-bg" stroke="#3fb950" />
    <text x="87" y="26" class="font t-title" text-anchor="middle">PostgreSQL</text>
    <text x="87" y="42" class="font" fill="#3fb950" font-size="10" text-anchor="middle">ACID / pgx Pooling</text>
    <text x="87" y="54" class="font t-sub" text-anchor="middle">Partitioned Tables</text>
  </g>
</svg>
