<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 250" width="100%" height="100%">
  <defs>
    <style>
      .font { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; line-height: 19px; }
      .bg { fill: #0d1117; stroke: #30363d; stroke-width: 1; rx: 10px; }
      .bar { fill: #161b22; stroke: #30363d; stroke-width: 1; }
      .btn-r { fill: #ff5f56; }
      .btn-y { fill: #ffbd2e; }
      .btn-g { fill: #27c93f; }
      .t-dim { fill: #8b949e; }
      .t-main { fill: #e6edf3; }
      .t-green { fill: #3fb950; font-weight: bold; }
      .t-cyan { fill: #58a6ff; }
      .t-purple { fill: #bc8cff; }
      .t-yellow { fill: #e3b341; }
      .t-bold { font-weight: bold; fill: #ffffff; }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect width="850" height="250" class="bg" />

  <!-- Window Header Bar -->
  <path d="M 0 10 C 0 4.48 4.48 0 10 0 L 840 0 C 845.52 0 850 4.48 850 10 L 850 34 L 0 34 Z" class="bar" />
  
  <!-- Window Controls -->
  <circle cx="20" cy="17" r="6" class="btn-r" />
  <circle cx="38" cy="17" r="6" class="btn-y" />
  <circle cx="56" cy="17" r="6" class="btn-g" />
  <text x="425" y="21" class="font t-dim" text-anchor="middle" font-size="12">palenhame@prod: ~ (bash)</text>

  <!-- Terminal Content -->
  <g class="font" transform="translate(24, 60)">
    <!-- Command Prompt -->
    <text x="0" y="0">
      <tspan class="t-cyan">palenhame@prod</tspan><tspan class="t-dim">:</tspan><tspan class="t-purple">~</tspan><tspan class="t-main">$ </tspan><tspan class="t-bold">systemctl status engineer.service</tspan>
    </text>

    <!-- Status Output -->
    <text x="0" y="24">
      <tspan class="t-green">●</tspan><tspan class="t-bold"> engineer.service</tspan><tspan class="t-main"> - High-Concurrency Backend Runtime &amp; Storage</tspan>
    </text>

    <text x="18" y="46">
      <tspan class="t-dim">Loaded: </tspan><tspan class="t-main">loaded (/etc/systemd/system/engineer.service; </tspan><tspan class="t-green">enabled</tspan><tspan class="t-main">; vendor preset: enabled)</tspan>
    </text>

    <text x="18" y="68">
      <tspan class="t-dim">Active: </tspan><tspan class="t-green">active (running)</tspan><tspan class="t-dim"> since Sun 2026-11-15 17:30:00 MSK; </tspan><tspan class="t-yellow">99.98% uptime</tspan>
    </text>

    <text x="18" y="90">
      <tspan class="t-dim">Main PID: </tspan><tspan class="t-cyan">2026</tspan><tspan class="t-main"> (palenhame-daemon) · </tspan><tspan class="t-dim">Tasks: </tspan><tspan class="t-main">16 (limit: 4096)</tspan>
    </text>

    <text x="18" y="112">
      <tspan class="t-dim">Memory: </tspan><tspan class="t-main">128.4M (Max: 512.0M, L1 Cache: </tspan><tspan class="t-cyan">Redis</tspan><tspan class="t-main">, Storage: </tspan><tspan class="t-cyan">PostgreSQL</tspan><tspan class="t-main">)</tspan>
    </text>

    <text x="18" y="134">
      <tspan class="t-dim">CGroup: </tspan><tspan class="t-dim">/system.slice/engineer.service</tspan>
    </text>

    <text x="74" y="154">
      <tspan class="t-dim">├─2026 </tspan><tspan class="t-yellow">/usr/local/bin/go-runtime</tspan><tspan class="t-dim"> --concurrency=goroutines --pgx-pool=active</tspan>
    </text>

    <text x="74" y="174">
      <tspan class="t-dim">└─2027 </tspan><tspan class="t-cyan">/usr/local/bin/python-worker</tspan><tspan class="t-dim"> --fastapi --asyncio --docker=isolated</tspan>
    </text>
  </g>
</svg>
